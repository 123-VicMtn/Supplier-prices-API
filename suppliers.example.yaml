# Configuration des fournisseurs.
# Copier en suppliers.yaml. Les mots de passe n'apparaissent JAMAIS ici:
# on ecrit ${NOM_DE_VARIABLE}, la valeur vient de l'environnement (voir .env).

database: var/prices.db

defaults:
  delay: 1.5 # secondes minimum entre deux requetes vers un meme hote
  workers: 4 # requetes paralleles (adaptateur sitemap uniquement)
  currency: CHF
  session_dir: var/sessions

suppliers:
  # --- Cas 1: catalogue JSON expose (le plus simple) -------------------------
  # recon.py a repondu "JACKPOT". Aucun scraping, aucun selecteur a maintenir.
  - key: fournisseur_shopify
    name: Fournisseur A
    type: shopify
    base_url: https://shop-fournisseur-a.com

  - key: fournisseur_woo
    name: Fournisseur B
    type: woocommerce
    base_url: https://www.fournisseur-b.ch

  # --- Cas 2: sitemap + JSON-LD (le cas general) -----------------------------
  - key: fournisseur_public
    name: Fournisseur C
    type: sitemap
    base_url: https://www.fournisseur-c.fr
    # Restreint les sous-sitemaps a explorer (evite de parcourir le blog).
    sitemap_filter: "produit|product"
    # Ne garde que les URLs qui ressemblent a une fiche article.
    product_url_pattern: "/produit/|/p/"
    # Filet de securite si ni JSON-LD ni microdata ne portent le prix.
    # "@attr" lit un attribut au lieu du texte.
    selectors:
      price: "meta[property='product:price:amount']@content"
      sku: "span.reference"
      name: "h1.product-title"

  # --- Cas 3: prix negocies derriere un compte pro ---------------------------
  - key: fournisseur_pro
    name: Fournisseur D (compte pro)
    type: sitemap
    base_url: https://pro.fournisseur-d.com
    delay: 1.5 # on est identifie: on se montre poli
    workers: 2
    auth:
      url: https://pro.fournisseur-d.com/login
      data: # noms des champs du formulaire reel
        email: ${FOURNISSEUR_D_USER}
        password: ${FOURNISSEUR_D_PASS}
      check: "Se deconnecter" # texte present UNIQUEMENT une fois connecte
      probe: https://pro.fournisseur-d.com/mon-compte
    product_url_pattern: "/article/"

  # --- Cas 4: prix rendu en JavaScript (dernier recours) ---------------------
  - key: fournisseur_spa
    name: Fournisseur E
    type: browser
    enabled: false # a n'activer qu'apres avoir confirme le besoin
    base_url: https://www.fournisseur-e.com
    delay: 3.0
    chromium: /usr/bin/chromium # Chromium systeme (apt), pas celui de Playwright
    wait_for: "[data-testid='price']" # selecteur qui signale que le prix est arrive
    product_url_pattern: "/produits/"
