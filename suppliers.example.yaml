# Supplier configuration.
# Copy to suppliers.yaml. Passwords NEVER appear here:
# use ${VAR_NAME}; the value comes from the environment (see .env).

database: var/prices.db

defaults:
  delay: 1.5 # minimum seconds between two requests to the same host
  workers: 4 # parallel requests (sitemap adapter only)
  currency: CHF
  session_dir: var/sessions

suppliers:
  # --- Case 1: exposed JSON catalog (simplest) -------------------------------
  # recon.py reported "JACKPOT". No scraping, no selectors to maintain.
  - key: fournisseur_shopify
    name: Supplier A
    type: shopify
    base_url: https://shop-fournisseur-a.com

  - key: fournisseur_woo
    name: Supplier B
    type: woocommerce
    base_url: https://www.fournisseur-b.ch

  # --- Case 2: sitemap + JSON-LD (the general case) --------------------------
  - key: fournisseur_public
    name: Supplier C
    type: sitemap
    base_url: https://www.fournisseur-c.fr
    # Restrict sitemaps to crawl (avoids traversing the blog).
    sitemap_filter: "produit|product"
    # Keep only URLs that look like product pages.
    product_url_pattern: "/produit/|/p/"
    # Fallback if neither JSON-LD nor microdata carries the price.
    # "@attr" reads an attribute instead of text content.
    selectors:
      price: "meta[property='product:price:amount']@content"
      sku: "span.reference"
      name: "h1.product-title"

  # --- Case 3: negotiated prices behind a pro account ------------------------
  - key: fournisseur_pro
    name: Supplier D (pro account)
    type: sitemap
    base_url: https://pro.fournisseur-d.com
    delay: 1.5 # authenticated: stay polite
    workers: 2
    auth:
      url: https://pro.fournisseur-d.com/login
      data: # field names from the actual login form
        email: ${FOURNISSEUR_D_USER}
        password: ${FOURNISSEUR_D_PASS}
      check: "Log out" # text present ONLY when logged in
      probe: https://pro.fournisseur-d.com/mon-compte
    product_url_pattern: "/article/"

  # --- Case 4: price rendered in JavaScript (last resort) --------------------
  - key: fournisseur_spa
    name: Supplier E
    type: browser
    enabled: false # enable only after confirming the need
    base_url: https://www.fournisseur-e.com
    delay: 3.0
    chromium: /usr/bin/chromium # system Chromium (apt), not Playwright's
    wait_for: "[data-testid='price']" # selector that signals the price has loaded
    product_url_pattern: "/produits/"
